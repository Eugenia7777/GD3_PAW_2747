<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman Interaktif - Eug</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
  <a href="profil.html" onclick="return confirm('Apakah Anda yakin ingin ke halaman Profil?');">Profil</a> |
  <a href="form.html" onclick="return confirm('Apakah Anda yakin ingin ke halaman Form?');">Form</a> |
  <a href="interaktif.html" onclick="return confirm('Apakah Anda yakin ingin ke halaman Interaktif?');">Interaktif</a>
  </nav>
  <h1 id="judulHalaman">Halaman Interaktif Eug</h1>
  <p id="teks">Teks ini bisa berubah!</p>
  <button onclick="ubahBiru()">Ubah ke Biru</button>
  <div>
    <label for="inputNama">Masukkan Nama Anda:</label>
    <input type="text" id="inputNama" placeholder="Nama Anda...">
    <button onclick="tampilkanNama()">Tampilkan</button>
  </div>
  <div>
    <h3>Kalkulator Hitung Luas Persegi</h3>
    <label for="inputSisi">Masukkan Panjang Sisi (cm):</label>
    <input type="number" id="inputSisi" placeholder="Contoh: 5">
    <button onclick="hitungLuas()">Hitung Luas</button>
    <p id="hasilHitung" style="margin-top: 10px; font-weight: bold; color: #4f46e5;"></p>
  </div>
  <script>
    const judul = document.getElementById("judulHalaman");
    judul.style.color = "red";
    console.log(judul.innerHTML);
    function sapa(nama) {
      return "Halo, " + nama + "!";
    }
    console.log(sapa("Jeni"));
    function ubahBiru() {
      document.getElementById("teks").style.color = "blue";
    }
    function tampilkanNama() {
      const nama = document.getElementById("inputNama").value;
      if (nama.trim() === "") {
        alert("Silakan isi nama dulu.");
      } else {
        alert("Halo, " + nama + "!");
      }
    }
    function hitungLuas() {
      const sisi = document.getElementById("inputSisi").value;
      if (sisi === "" || sisi <= 0) {
        alert("Silakan masukkan angka sisi yang valid (lebih dari 0)!");
      } else {
        const luas = sisi * sisi;
        alert("Luas persegi dengan sisi " + sisi + " cm adalah " + luas + " cm²");
        document.getElementById("hasilHitung").innerHTML = "Hasil: " + luas + " cm²";
      }
    }
  </script>
</body>
</html>
